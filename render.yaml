services:
  - type: web
    name: pc28-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DELAY_SECONDS
        sync: false
      - key: POLL_INTERVAL
        sync: false
      - key: PORT
        sync: false
    plan: free
